<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head><body>
<title>Cahier de français</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<link rel="stylesheet" href="estil.css">
<!--
  CAHIER DE FRANÇAIS
  · estil.css  → el disseny (comú a tots els temes)
  · motor.js   → les activitats (comú a tots els temes)
  · lexic.js   → diccionari de noms i adjectius per als generadors de frases
  · temes/     → un fitxer per tema: aquí és on es corregeix i s'amplia

  TEMA NOU: crea temes/nom.js amb CAHIER.tema({...}) i afegeix-ne una línia
  <script src="temes/nom.js"></script> a la llista de sota.
  L'ordre de la llista és l'ordre de l'índex.

  Camps d'un tema:
    id        identificador curt, igual que el nom del fitxer: "couleurs"
    bloc      "comunicacio" | "vocabulari" | "mon" | "gramatica"
    titol     nom del tema a l'índex
    mostra    2-3 paraules d'exemple que surten a la targeta
    desc      una línia de descripció
    afegit    data "AAAA-MM-DD" (durant 2 setmanes surt l'etiqueta «Nou»)
    consell   frase d'ajuda que surt sota les activitats
    regla     explicació (HTML). El francès entre «…» es pot escoltar.
    items     vocabulari: ["français","català"] o ["le stylo","el bolígraf","m"]
              (gènere: "m", "f" o "p" plural)
    frases    frases per completar: ["J'habite ___ Paris.","à",["à","en","au","aux"],"Visc a París.","ciutat → à"]
    parells   parelles per unir: [["Comment ça va ?","Ça va bien."], ...]
    ordenat   true si els items tenen un ordre (mesos, dies…)
    genFrase  generador de frases infinites (vegeu temes/demonstratifs.js)
    generat   proporció de frases generades quan n'hi ha també d'escrites: 0.7
  Les activitats es trien soles segons el que tingui cada tema.
-->
<div class="wrap" id="app"></div>

<script src="motor.js"></script>
<script src="lexic.js"></script>
<script>
CAHIER.blocs([
  {id:"comunicacio",nom:"Comunicació"},
  {id:"vocabulari",nom:"Vocabulari"},
  {id:"mon",nom:"El món"},
  {id:"gramatica",nom:"Gramàtica"}
]);
</script>

<!-- TEMES (un fitxer per tema) -->
<script src="temes/salut.js"></script>
<script src="temes/questions.js"></script>
<script src="temes/nombres.js"></script>
<script src="temes/ordinaux.js"></script>
<script src="temes/mois.js"></script>
<script src="temes/jours.js"></script>
<script src="temes/objets.js"></script>
<script src="temes/maison.js"></script>
<script src="temes/pays.js"></script>
<script src="temes/villes.js"></script>
<script src="temes/nationalites.js"></script>
<script src="temes/articles.js"></script>
<script src="temes/possessifs.js"></script>
<script src="temes/demonstratifs.js"></script>
<script src="temes/verbes.js"></script>
</body></html>
