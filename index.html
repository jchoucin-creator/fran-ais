<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
</head><body>
<title>Cahier de français</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Atkinson+Hyperlegible:wght@400;700&display=swap">
<style>
/* Layout: a French school notebook (cahier Seyès). Index = list of chapters grouped by bloc; each tema = sticky header + scrollable activity tabs + one card */
:root{
  --paper:#fbfaf7; --line:#d9dcef; --line-strong:#b9bfe3; --margin:#e0525a;
  --ink:#2b2350; --ink-soft:#5f5a7a; --violet:#5b3fb8; --violet-soft:#ece7fb;
  --ok:#1f7a4d; --ok-bg:#e3f4ea; --ko:#b3323a; --ko-bg:#fbe6e7;
  --masc:#2a63b8; --fem:#c0447a; --card:#ffffff; --shadow:0 1px 2px rgba(43,35,80,.08),0 4px 14px rgba(43,35,80,.06);
  --f-display:"Caveat","Segoe Print","Comic Sans MS",cursive;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#17152a; --line:#25223f; --line-strong:#353160; --margin:#e8707a;
  --ink:#ece9fb; --ink-soft:#aaa5c8; --violet:#b4a1ff; --violet-soft:#2a2550;
  --ok:#6fd49d; --ok-bg:#183626; --ko:#ff8f97; --ko-bg:#3e1d22;
  --masc:#7fb0ff; --fem:#ff8fbf; --card:#1f1c36; --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#17152a; --line:#25223f; --line-strong:#353160; --margin:#e8707a;
  --ink:#ece9fb; --ink-soft:#aaa5c8; --violet:#b4a1ff; --violet-soft:#2a2550;
  --ok:#6fd49d; --ok-bg:#183626; --ko:#ff8f97; --ko-bg:#3e1d22;
  --masc:#7fb0ff; --fem:#ff8fbf; --card:#1f1c36; --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.5;
  background-image:repeating-linear-gradient(to bottom,transparent 0 31px,var(--line) 31px 32px);}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 56px;position:relative;min-height:100vh}
.wrap::before{content:"";position:absolute;left:6px;top:0;bottom:0;width:2px;background:var(--margin);opacity:.5}
.in{padding-left:14px}
a{color:var(--violet)}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--violet);outline-offset:2px}

/* ---------- index ---------- */
.hero{padding-block:28px 6px}
h1{font-family:var(--f-display);font-size:clamp(2.6rem,9vw,3.6rem);line-height:1;margin:0;color:var(--violet);text-wrap:balance}
.sub{margin:.4rem 0 0;color:var(--ink-soft);max-width:60ch}
.resume{display:flex;align-items:center;gap:10px;margin-top:16px;padding:12px 14px;border-radius:12px;background:var(--violet-soft);color:var(--violet);
  text-decoration:none;font-weight:700}
.resume span{font-weight:400;color:var(--ink-soft)}
.bloc{margin-top:26px}
.bloc h2{font-family:var(--f-display);font-size:2rem;line-height:1;margin:0 0 10px;color:var(--ink)}
.cards{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:600px){.cards{grid-template-columns:1fr 1fr}}
.card{display:grid;grid-template-columns:5.6rem minmax(0,1fr);gap:12px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--card);
  box-shadow:var(--shadow);text-decoration:none;color:var(--ink);min-height:76px;position:relative;padding-right:42px}
.card:active{transform:scale(.99)}
.chip{font-family:var(--f-display);font-size:1.45rem;line-height:1.05;color:var(--violet);text-align:center;overflow-wrap:anywhere}
.card b{display:block;font-size:1.02rem;line-height:1.25}
.card small{display:block;color:var(--ink-soft);font-size:.85rem;line-height:1.3;margin-top:2px}
.prog{height:4px;border-radius:2px;background:var(--line);margin-top:8px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--ok)}
.progtxt{font-size:.75rem;color:var(--ink-soft);margin-top:3px;font-variant-numeric:tabular-nums}
.nou{position:absolute;top:8px;right:10px;font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--margin)}
.foot{margin-top:32px;font-size:.85rem;color:var(--ink-soft);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.foot button{font:inherit;background:none;border:1px solid var(--line-strong);color:var(--ink-soft);border-radius:8px;padding:.3rem .7rem;cursor:pointer}

/* ---------- tema ---------- */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);display:flex;align-items:center;gap:10px;
  padding-block:10px;border-bottom:1px solid var(--line);margin-inline:-16px;padding-inline:30px 16px}
.back{display:inline-flex;align-items:center;gap:4px;text-decoration:none;font-weight:700;color:var(--violet);padding:.4rem .2rem;flex:0 0 auto}
.top h1{font-size:1.9rem;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-block:12px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.tabs::-webkit-scrollbar{display:none}
.tabs button,.rooms button{font:inherit;font-size:.92rem;flex:0 0 auto;border:1.5px solid var(--line-strong);background:var(--card);color:var(--ink);
  padding:.42rem .8rem;border-radius:999px;cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--violet);border-color:var(--violet);color:var(--paper);font-weight:700}
.rooms{display:flex;gap:6px;overflow-x:auto;padding-bottom:10px;scrollbar-width:none}
.rooms button{font-size:.82rem;padding:.3rem .65rem;border-radius:8px}
.rooms button[aria-pressed="true"]{background:var(--violet-soft);border-color:var(--violet);color:var(--violet);font-weight:700}
.stage{background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:20px 16px;min-height:300px}
.tip{margin:16px 0 0;color:var(--ink-soft);font-size:.92rem;max-width:65ch}
.label{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-soft);margin:0 0 6px}
.prompt{font-family:var(--f-display);font-size:clamp(2.1rem,8vw,3.1rem);line-height:1.1;margin:4px 0 14px;text-align:center;overflow-wrap:anywhere}
.prompt.small{font-family:var(--f-body);font-size:1.35rem;font-weight:700}
.sent{font-size:1.4rem;font-weight:700;text-align:center;line-height:1.45;margin:6px 0 4px;overflow-wrap:anywhere}
.gap{display:inline-block;min-width:3.4em;border-bottom:2.5px solid var(--violet);color:var(--violet);text-align:center}
.cahint{text-align:center;color:var(--ink-soft);margin:0 0 6px}
.why{text-align:center;color:var(--ink-soft);font-size:.95rem;margin:6px 0 0}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center}
.opts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
@media (max-width:420px){.opts.many{grid-template-columns:1fr}}
.opt{font:inherit;font-size:1.08rem;text-align:center;padding:.8rem .6rem;border-radius:10px;border:1.5px solid var(--line-strong);
  background:var(--paper);color:var(--ink);cursor:pointer;min-width:0;overflow-wrap:anywhere}
.opt:hover:not(:disabled){border-color:var(--violet)}
.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:700}
.opt.ko{background:var(--ko-bg);border-color:var(--ko);color:var(--ko)}
.btn{font:inherit;font-weight:700;padding:.65rem 1.15rem;border-radius:10px;border:0;background:var(--violet);color:var(--paper);cursor:pointer}
.btn.ghost{background:transparent;color:var(--violet);border:1.5px solid var(--violet)}
.speak{font:inherit;display:inline-flex;align-items:center;gap:6px;padding:.5rem .9rem;border-radius:999px;border:1.5px solid var(--violet);
  background:var(--violet-soft);color:var(--violet);font-weight:700;cursor:pointer}
.speak svg{width:18px;height:18px}
.big-speak{font-size:1.2rem;padding:1rem 1.6rem}
.flash{margin:6px auto 16px;max-width:440px}
.flash-inner{border:1.5px dashed var(--line-strong);border-radius:12px;padding:24px 14px;text-align:center;cursor:pointer;background:
  repeating-linear-gradient(to bottom,transparent 0 23px,var(--line) 23px 24px);min-height:160px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.flash-inner .fr{font-family:var(--f-display);font-size:2.4rem;line-height:1.1;overflow-wrap:anywhere}
.flash-inner .ca{font-size:1.1rem;color:var(--ink-soft)}
.flash-inner .hint{font-size:.8rem;color:var(--ink-soft)}
.feedback{min-height:1.6em;text-align:center;margin-top:12px;font-weight:700}
.feedback.ok{color:var(--ok)} .feedback.ko{color:var(--ko)}
input.answer{font:inherit;font-size:1.3rem;width:100%;max-width:420px;padding:.6rem .8rem;border-radius:10px;border:1.5px solid var(--line-strong);
  background:var(--paper);color:var(--ink);text-align:center}
.accents{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.accents button{font:inherit;min-width:38px;min-height:38px;padding:.25rem .5rem;border-radius:6px;border:1px solid var(--line-strong);background:var(--card);color:var(--ink);cursor:pointer}
.score{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:.88rem;color:var(--ink-soft);margin-bottom:12px;font-variant-numeric:tabular-nums}
.score b{color:var(--ink)}
.gender{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;margin-top:8px}
.gender .opt{min-width:110px;font-family:var(--f-display);font-size:2rem;padding:.4rem 1rem}
.gender .opt[data-g="m"]{color:var(--masc)} .gender .opt[data-g="f"]{color:var(--fem)}
.gender .opt.ok,.gender .opt.ko{color:inherit}
.tag{font-size:.72rem;font-weight:700;padding:.08rem .45rem;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.tag.m{color:var(--masc)} .tag.f{color:var(--fem)} .tag.p{color:var(--ink-soft)}
.match{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.match .col{display:flex;flex-direction:column;gap:8px;min-width:0}
.match .opt{font-size:.98rem;padding:.7rem .5rem}
.match .opt.sel{border-color:var(--violet);background:var(--violet-soft)}
.match .opt.done{opacity:.45;background:var(--ok-bg);border-color:var(--ok);cursor:default}
.vocab{width:100%;border-collapse:collapse;font-size:.95rem}
.vocab td{padding:.45rem .4rem;border-bottom:1px solid var(--line);vertical-align:middle}
.vocab td:first-child{font-weight:700}
.vocab button{background:none;border:0;color:var(--violet);cursor:pointer;padding:6px}
.vocab svg{width:18px;height:18px}
.tablewrap{overflow-x:auto}
.tiles{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:12px}
.tile{font:inherit;font-size:1.1rem;padding:.5rem .8rem;border-radius:10px;border:1.5px solid var(--line-strong);background:var(--paper);color:var(--ink);cursor:pointer}
.built{min-height:3.2rem;border-bottom:2px dashed var(--line-strong);display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center;padding:6px 0}
.built .tile{background:var(--violet-soft);border-color:var(--violet);color:var(--violet);font-weight:700}
/* rule sheets */
.regla{max-width:65ch;margin:0 auto}
.regla h3{font-family:var(--f-display);font-size:1.8rem;line-height:1.1;color:var(--violet);margin:18px 0 6px}
.regla h3:first-child{margin-top:0}
.regla p,.regla li{margin:.35rem 0}
.regla ul{padding-left:1.2rem;margin:.3rem 0}
.regla table{border-collapse:collapse;width:100%;font-size:.95rem;margin:6px 0}
.regla th{text-align:left;font-size:.75rem;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);padding:.35rem .4rem;border-bottom:1.5px solid var(--line-strong)}
.regla td{padding:.4rem .4rem;border-bottom:1px solid var(--line);vertical-align:top}
.ex{color:var(--violet);font-weight:700;border-bottom:1px dotted currentColor;cursor:pointer}
.alerta{background:var(--violet-soft);border-radius:10px;padding:10px 12px;margin:10px 0}
details.verb{border:1.5px solid var(--line);border-radius:10px;margin:8px 0;background:var(--paper)}
details.verb summary{cursor:pointer;padding:.6rem .8rem;font-weight:700;list-style-position:inside}
details.verb summary span{font-weight:400;color:var(--ink-soft)}
details.verb table{margin:0}
details.verb td{padding:.35rem .8rem}
@media (prefers-reduced-motion:no-preference){.opt,.btn,.tile,.flash-inner,.card{transition:background .15s,border-color .15s,transform .15s}.opt:active,.tile:active{transform:scale(.97)}}
</style>

<div class="wrap" id="app"></div>

<script>
/* ======================================================================
   CONTINGUTS DEL CAHIER
   ----------------------------------------------------------------------
   Cada tema és un bloc { ... } dins de TEMES. Per afegir-ne un de nou,
   copia'n un de semblant, canvia l'id (sense espais) i omple'l.
   Apareix sol a l'índex, dins del bloc que indiquis.

   Camps:
     id        identificador curt: "couleurs"
     bloc      "comunicacio" | "vocabulari" | "mon" | "gramatica"
     titol     nom del tema a l'índex
     mostra    2-3 paraules d'exemple que surten a la targeta
     desc      una línia de descripció
     afegit    data "AAAA-MM-DD" (durant 2 setmanes surt l'etiqueta «Nou»)
     consell   frase d'ajuda que surt sota les activitats
     regla     explicació (HTML). El francès entre «…» es pot escoltar.
     items     vocabulari: ["français","català"] o ["le stylo","el bolígraf","m"]
               (gènere: "m", "f" o "p" plural)
     frases    frases per completar: ["J'habite ___ Paris.","à",["à","en","au","aux"],"Visc a París.","ciutat → à"]
     parells   parelles per unir: [["Comment ça va ?","Ça va bien."], ...]
     ordenat   true si els items tenen un ordre (mesos, dies…)
   Les activitats es trien soles segons el que tingui el tema.
   ====================================================================== */
const BLOCS=[
  {id:"comunicacio",nom:"Comunicació"},
  {id:"vocabulari",nom:"Vocabulari"},
  {id:"mon",nom:"El món"},
  {id:"gramatica",nom:"Gramàtica"}
];

const TEMES=[
/* ---------------- COMUNICACIÓ ---------------- */
{id:"salut",bloc:"comunicacio",titol:"Salutacions",mostra:"Salut !",desc:"Bonjour, au revoir, merci… per saludar i presentar-te",afegit:"2026-10-12",
 consell:"Bonjour serveix tot el dia; bonsoir, a partir del vespre. Salut és informal, entre amics.",
 items:[["Bonjour","Bon dia / Hola"],["Bonsoir","Bona tarda (vespre)"],["Salut","Hola (informal)"],["Au revoir","Adéu"],["À bientôt","Fins aviat"],
  ["À demain","Fins demà"],["Bonne nuit","Bona nit"],["Comment ça va ?","Com va?"],["Ça va bien, merci","Va bé, gràcies"],
  ["Comment tu t'appelles ?","Com et dius?"],["Je m'appelle Joan","Em dic Joan"],["Enchanté / Enchantée","Encantat / Encantada"],
  ["S'il te plaît","Si us plau"],["Merci","Gràcies"],["De rien","De res"]]},

{id:"questions",bloc:"comunicacio",titol:"Les preguntes",mostra:"Quel… ?",desc:"Comment, où, quel / quelle… i com respondre",afegit:"2026-10-29",
 consell:"Fixa't en el gènere de la paraula que ve després: quel âge (masculí), quelle adresse (femení).",
 regla:`<h3>Les paraules per preguntar</h3>
<table><tr><th>Francès</th><th>Català</th><th>Exemple</th></tr>
<tr><td><b>Comment ?</b></td><td>Com?</td><td>«Comment tu t'appelles ?»</td></tr>
<tr><td><b>Où ?</b></td><td>On?</td><td>«Où habites-tu ?»</td></tr>
<tr><td><b>D'où ?</b></td><td>D'on?</td><td>«D'où viens-tu ?»</td></tr>
<tr><td><b>Qui ?</b></td><td>Qui?</td><td>«Qui est-ce ?»</td></tr>
<tr><td><b>Qu'est-ce que… ?</b></td><td>Què?</td><td>«Qu'est-ce que c'est ?»</td></tr>
<tr><td><b>Quand ?</b></td><td>Quan?</td><td>«C'est quand, ton anniversaire ?»</td></tr>
<tr><td><b>Combien ?</b></td><td>Quant?</td><td>«Combien de frères as-tu ?»</td></tr>
<tr><td><b>Pourquoi ?</b></td><td>Per què?</td><td>«Pourquoi tu apprends le français ?»</td></tr></table>
<p>La resposta a <b>pourquoi</b> comença per <b>parce que</b> (perquè): «Parce que j'aime voyager.»</p>
<h3>Quel, quelle, quels, quelles</h3>
<p>Vol dir «quin / quina» i concorda amb el nom:</p>
<table><tr><th></th><th>Singular</th><th>Plural</th></tr>
<tr><td>Masculí</td><td>«Quel âge as-tu ?»</td><td>«Quels sports fais-tu ?»</td></tr>
<tr><td>Femení</td><td>«Quelle est ta nationalité ?»</td><td>«Quelles langues parles-tu ?»</td></tr></table>
<p>Totes quatre formes sonen igual: [kɛl].</p>
<h3>Tres maneres de preguntar</h3>
<ul><li>Parlant, amb entonació: «Tu habites où ?»</li>
<li>Amb <b>est-ce que</b>: «Où est-ce que tu habites ?»</li>
<li>Amb inversió (més formal): «Où habites-tu ?» El verb i el pronom s'uneixen amb un guionet.</li></ul>`,
 items:[["Comment tu t'appelles ?","Com et dius?"],["Comment ça va ?","Com va?"],["Quel âge as-tu ?","Quants anys tens?"],["Où habites-tu ?","On vius?"],
  ["D'où viens-tu ?","D'on vens?"],["Quelle est ta nationalité ?","Quina és la teva nacionalitat?"],["Quelles langues parles-tu ?","Quines llengües parles?"],
  ["Quel est ton numéro de téléphone ?","Quin és el teu número de telèfon?"],["Quelle est ton adresse ?","Quina és la teva adreça?"],
  ["C'est quand, ton anniversaire ?","Quan és el teu aniversari?"],["Qui est-ce ?","Qui és?"],["Qu'est-ce que c'est ?","Què és això?"],
  ["Combien de frères et sœurs as-tu ?","Quants germans tens?"],["Quel jour sommes-nous ?","Quin dia som?"],["Quelle heure est-il ?","Quina hora és?"],
  ["Quel est ton sport préféré ?","Quin és el teu esport preferit?"],["Quelle est ta couleur préférée ?","Quin és el teu color preferit?"],
  ["Tu aimes la musique ?","T'agrada la música?"],["Où est la gomme ?","On és la goma?"],["Pourquoi tu apprends le français ?","Per què aprens francès?"]],
 parells:[["Comment tu t'appelles ?","Je m'appelle Laia."],["Comment ça va ?","Ça va bien, merci."],["Quel âge as-tu ?","J'ai douze ans."],
  ["Où habites-tu ?","J'habite à Gérone."],["D'où viens-tu ?","Je viens d'Espagne."],["Quelle est ta nationalité ?","Je suis espagnole."],
  ["Quelles langues parles-tu ?","Je parle catalan et espagnol."],["Quel est ton numéro de téléphone ?","C'est le 06 12 34 56 78."],
  ["Quelle est ton adresse ?","C'est 8, rue Victor-Hugo."],["C'est quand, ton anniversaire ?","C'est le 14 mars."],["Qui est-ce ?","C'est ma sœur, Emma."],
  ["Qu'est-ce que c'est ?","C'est une trousse."],["Combien de frères et sœurs as-tu ?","J'ai un frère."],["Quel jour sommes-nous ?","Nous sommes jeudi."],
  ["Quelle heure est-il ?","Il est dix heures."],["Quel est ton sport préféré ?","C'est le basket."],["Quelle est ta couleur préférée ?","C'est le bleu."],
  ["Tu aimes la musique ?","Oui, j'adore la musique !"],["Où est la gomme ?","Elle est sur la table."],["Pourquoi tu apprends le français ?","Parce que j'aime voyager."]],
 frases:[
  ["___ tu t'appelles ?","Comment",["Comment","Où","Quel","Qui"],"Com et dius?","Comment = com"],
  ["___ habites-tu ? — À Barcelone.","Où",["Où","Quand","Comment","Qui"],"On vius? — A Barcelona.","Où = on"],
  ["___ viens-tu ? — De Catalogne.","D'où",["D'où","Où","Qui","Quand"],"D'on vens? — De Catalunya.","D'où = d'on (origen)"],
  ["___ âge as-tu ?","Quel",["Quel","Quelle","Quels","Quelles"],"Quants anys tens?","âge és masculí singular → quel"],
  ["___ est ta nationalité ?","Quelle",["Quel","Quelle","Quels","Quelles"],"Quina és la teva nacionalitat?","nationalité és femení → quelle"],
  ["___ est ton prénom ?","Quel",["Quel","Quelle","Quels","Quelles"],"Quin és el teu nom?","prénom és masculí → quel"],
  ["___ langues parles-tu ?","Quelles",["Quel","Quelle","Quels","Quelles"],"Quines llengües parles?","langues: femení plural → quelles"],
  ["___ sports fais-tu ?","Quels",["Quel","Quelle","Quels","Quelles"],"Quins esports fas?","sports: masculí plural → quels"],
  ["___ est ton adresse ?","Quelle",["Quel","Quelle","Quels","Quelles"],"Quina és la teva adreça?","adresse és femení → quelle (i diem ton adresse perquè comença per vocal)"],
  ["___ heure est-il ?","Quelle",["Quel","Quelle","Quels","Quelles"],"Quina hora és?","heure és femení → quelle"],

{id:"pays",bloc:"mon",titol:"Els països i el seu gènere",mostra:"la France",desc:"le Portugal, la France, les États-Unis",afegit:"2026-10-29",tipus:"pays",
 consell:"Truc: si el país acaba en -e, gairebé sempre és femení. Davant de vocal l'article és l' i no ens diu el gènere: l'Espagne (f), l'Iran (m).",
 regla:`<h3>Els països porten article</h3>
<p>En català diem «França», però en francès el país porta article: «la France», «le Portugal».</p>
<table><tr><th>Article</th><th>Quan</th><th>Exemples</th></tr>
<tr><td><b>la</b></td><td>femení</td><td>«la France», «la Belgique», «la Chine»</td></tr>
<tr><td><b>le</b></td><td>masculí</td><td>«le Portugal», «le Japon», «le Canada»</td></tr>
<tr><td><b>l'</b></td><td>comença per vocal</td><td>«l'Espagne», «l'Italie», «l'Iran»</td></tr>
<tr><td><b>les</b></td><td>plural</td><td>«les États-Unis», «les Pays-Bas»</td></tr></table>
<h3>Com saber el gènere?</h3>
<ul><li>Acaba en <b>-e</b> → femení: «la Suisse», «la Grèce», «l'Allemagne».</li>
<li>No acaba en -e → masculí: «le Maroc», «le Brésil», «le Sénégal».</li>
<li>Excepcions: «le Mexique», «le Cambodge» acaben en -e però són masculins.</li></ul>
<div class="alerta">Les ciutats no porten article: «Paris», «Barcelone», «Rome». Excepció: «Le Caire», «La Havane».</div>`,

{id:"articles",bloc:"gramatica",titol:"Els articles",mostra:"le · un",desc:"le, la, l', les · un, une, des",afegit:"2026-10-29",tipus:"articles",
 consell:"Quan en català no posem article («Hi ha llibres»), en francès sovint cal des: Il y a des livres.",
 regla:`<h3>Articles definits: le, la, l', les</h3>
<p>Per a una cosa concreta o coneguda, i per parlar de gustos en general.</p>
<table><tr><th></th><th>Singular</th><th>Plural</th></tr>
<tr><td>Masculí</td><td>«le livre»</td><td rowspan="2">«les livres», «les tables»</td></tr>
<tr><td>Femení</td><td>«la table»</td></tr>
<tr><td>Davant de vocal</td><td>«l'école», «l'ami»</td><td>«les écoles»</td></tr></table>
<p>«Le chat de Paul est noir.» «J'aime la musique.»</p>
<h3>Articles indefinits: un, une, des</h3>
<p>Per a una cosa qualsevol, o quan en parlem per primer cop.</p>
<table><tr><th></th><th>Singular</th><th>Plural</th></tr>
<tr><td>Masculí</td><td>«un livre»</td><td rowspan="2">«des livres», «des tables»</td></tr>
<tr><td>Femení</td><td>«une table»</td></tr></table>
<p>«J'ai un chat.» «Il y a des chaises dans la classe.»</p>
<div class="alerta">En francès el nom gairebé mai va sol. On el català no posa res, el francès posa <b>des</b>: «Hi ha cadires» → «Il y a des chaises».</div>
<h3>Els idiomes</h3>
<p>Porten article quan els estudies o t'agraden: «J'étudie le français.» Amb «parler» sovint no: «Je parle français.»</p>`,

  f={...f};f.fr=clean(fill(f.s,f.a));f.o=shuffle(uniq(f.o.includes(f.a)?f.o:[f.a,...f.o]));return f}

  recG=new SR();recG.lang="fr-FR";recG.continuous=true;recG.interimResults=false;recG.maxAlternatives=5;
  recG.onresult=e=>{if(ttsBusy)return;const r=e.results[e.results.length-1];if(!r.isFinal)return;
    const alts=[...r].map(a=>a.transcript.trim()).filter(Boolean);if(alts.length&&onHeard&&act==="parla")onHeard(alts)};
  recG.onerror=e=>{if(["not-allowed","service-not-allowed","audio-capture"].includes(e.error)){srBlocked=true;stopMic();if(act==="parla")RUN.parla()}};
  recG.onend=()=>{if(micOn)setTimeout(()=>{try{micOn&&recG&&recG.start()}catch(e){}},200)};

  paintMic();setFeedback("Micròfon obert. Digues-ho quan vulguis.","")}

    if((T.parlaFrases||!T.items)&&(T.frases||T.genFrase)){const f=pickFrase();it={fr:f.fr,ca:f.ca}}else it=pickItem();
    const targets=it.fr.split(" / ").map(t=>t.replace(/ Joan$/,""));
    const accept=[...targets,...it.fr.split(" / "),...(it.n!=null?[String(it.n)]:[]),...(it.abbr?[it.abbr]:[])];
    const canListen=SR&&!srBlocked;
    const shown=parlaMode==="llegeix"
      ?`<p class="label">Llegeix-ho en veu alta</p><p class="prompt ${it.fr.length>22?"small":""}">${esc(it.fr)}</p>`
      :`<p class="label">Digues-ho en francès (de memòria)</p><p class="prompt small">${T.tipus==="nombres"?`<span style="font-family:var(--f-display);font-size:3.2rem">${esc(it.ca)}</span>`:esc(it.ca)}</p>`;
    stage().innerHTML=scoreBar()+`<div class="row" style="margin-bottom:10px">
        <button class="speak" id="m-l" aria-pressed="${parlaMode==="llegeix"}" style="${parlaMode==="llegeix"?"":"background:transparent"}">Llegir</button>
        <button class="speak" id="m-r" aria-pressed="${parlaMode==="recita"}" style="${parlaMode==="recita"?"":"background:transparent"}">Recitar</button></div>
      ${shown}
      <div class="row" style="margin:6px 0 4px">${canListen?`<button class="btn mic" id="mic">🎤 Obre el micròfon</button>`:""}<span id="model" ${parlaMode==="recita"?"hidden":""}>${speakBtn(spoken(it.fr))}</span></div>
      <p id="heard" style="text-align:center;color:var(--ink-soft);min-height:1.5em;margin:8px 0 0"></p>
      <div class="row" id="self" ${canListen?"hidden":""} style="margin-top:8px">
        <button class="btn ghost" id="s-ko">Ho he de repetir</button><button class="btn" id="s-ok">Ho he dit bé</button></div>
      <p class="feedback" id="fb">${canListen?"":"Aquí no es pot fer servir el micròfon. Digues-ho en veu alta, escolta el model i valora-ho tu mateix."}</p>`+nextBtn();
    $("#m-l").onclick=()=>{parlaMode="llegeix";RUN.parla()};$("#m-r").onclick=()=>{parlaMode="recita";RUN.parla()};
    let done=false;const reveal=()=>{const m=$("#model");if(m)m.hidden=false};
    if(!canListen){
      if(parlaMode==="recita"){$("#self").hidden=true;const r=document.createElement("div");r.className="row";r.innerHTML=`<button class="btn ghost" id="show">Mostra la resposta</button>`;$("#self").before(r);
        $("#show").onclick=()=>{r.remove();reveal();$("#self").hidden=false;$("#heard").textContent=it.fr;say(spoken(it.fr))}}
      $("#s-ok").onclick=()=>{if(done)return;done=true;mark(true);setFeedback("✔ Très bien !","ok")};
      $("#s-ko").onclick=()=>{if(done)return;done=true;mark(false);setFeedback("Escolta el model i torna-ho a provar.","ko");say(spoken(it.fr))};
    } else {
      paintMic();if(micOn)setFeedback("Micròfon obert. Digues-ho quan vulguis.","");
      $("#mic").onclick=()=>micOn?stopMic():startMic();
      onHeard=alts=>{
        let best=alts[0],bestScore=0;
        for(const a of alts)for(const t of accept){const x=snorm(a),y=snorm(t);const s=1-lev(x,y)/Math.max(x.length,y.length,1);if(s>bestScore){bestScore=s;best=a}}
        if(it.n!=null&&alts.some(a=>a.replace(/\D/g,"")===String(it.n))){bestScore=1;best=alts.find(a=>a.replace(/\D/g,"")===String(it.n))}
        $("#heard").innerHTML=`He entès: «<b>${esc(best)}</b>»`;
        const counted=!done;done=true;
        if(bestScore>=.99){if(counted)mark(true);setFeedback("✔ Parfait ! Pronúncia reconeguda.","ok");nextTimer=setTimeout(RUN.parla,1600)}
        else if(bestScore>=.7){if(counted)mark(true);setFeedback("✔ Gairebé! Era: "+it.fr,"ok");reveal();nextTimer=setTimeout(RUN.parla,2600)}
        else{if(counted)mark(false);setFeedback("✘ No ho he reconegut. Era: "+it.fr+" — torna-ho a provar.","ko");reveal();say(spoken(it.fr))}};
    }
    wireNext(RUN.parla)}
};

/* ---------- views ---------- */
const DAY=864e5;
function isNew(t){return t.afegit&&(Date.now()-new Date(t.afegit).getTime())<14*DAY}
function renderIndex(){
  const last=TEMES.find(t=>t.id===PROG._last);
  $("#app").innerHTML=`<div class="in"><header class="hero"><h1>Cahier de français</h1>
    <p class="sub">Francès per a principiants. Tria un tema i practica amb àudio, targetes, jocs i el micròfon.</p>
    ${last?`<a class="resume" href="#${last.id}">Continua → ${esc(last.titol)} <span>· on ho vas deixar</span></a>`:""}</header>
    ${BLOCS.map(b=>{const ts=TEMES.filter(t=>t.bloc===b.id);if(!ts.length)return "";
      return `<section class="bloc"><h2>${b.nom}</h2><div class="cards">${ts.map(t=>{const p=PROG[t.id];const pct=p&&p.total?Math.round(100*p.ok/p.total):0;
        return `<a class="card" href="#${t.id}">${isNew(t)?`<span class="nou">Nou</span>`:""}<span class="chip">${esc(t.mostra||"")}</span>
          <span style="min-width:0"><b>${esc(t.titol)}</b><small>${esc(t.desc||"")}</small>
          ${p&&p.total?`<span class="prog" aria-hidden="true"><i style="width:${pct}%"></i></span><span class="progtxt">${p.ok} encerts de ${p.total} · ${pct}%</span>`:""}</span></a>`}).join("")}</div></section>`}).join("")}
    <div class="foot"><span>El progrés es guarda només en aquest dispositiu.</span><button id="reset">Esborra el meu progrés</button></div></div>`;
  const r=$("#reset");let armed=false;
  r.onclick=()=>{if(!armed){armed=true;r.textContent="Segur? Toca de nou per esborrar";return}PROG={};saveProg();renderIndex()};
}
function renderTema(){
  const A=actsOf(T);
  $("#app").innerHTML=`<div class="top"><a class="back" href="#" aria-label="Torna a l'índex">← Índex</a><h1>${esc(T.titol)}</h1></div>
    <div class="in"><nav class="tabs" id="tabs" aria-label="Activitats">${A.map(a=>`<button aria-pressed="${a===act}" data-a="${a}">${ACTS[a]}</button>`).join("")}</nav>
    ${T.estances?`<div class="rooms" id="rooms">${Object.entries(T.estances).map(([k,v])=>`<button aria-pressed="${k===room}" data-r="${k}">${v}</button>`).join("")}</div>`:""}
    <section class="stage" id="stage" aria-live="polite"></section>
    ${T.consell?`<p class="tip">💡 ${esc(T.consell)}</p>`:""}</div>`;
  $("#tabs").onclick=e=>{const b=e.target.closest("[data-a]");if(!b)return;history.replaceState(null,"","#"+T.id+"."+b.dataset.a);route()};
  if(T.estances)$("#rooms").onclick=e=>{const b=e.target.closest("[data-r]");if(!b)return;room=b.dataset.r;score={ok:0,total:0};renderTema()};
  const cur=$("#tabs [aria-pressed=true]");if(cur)cur.scrollIntoView({block:"nearest",inline:"center"});
  clearTimeout(nextTimer);if(act!=="parla"&&micOn)stopMic();
  RUN[act]();
}
function route(){
  const [id,a]=decodeURIComponent(location.hash.slice(1)).split(".");
  const t=TEMES.find(x=>x.id===id);
  clearTimeout(nextTimer);
  if(!t){if(micOn)stopMic();T=null;renderIndex();window.scrollTo(0,0);return}
  const A=actsOf(t);const newT=T!==t;
  if(newT){T=t;room="tot";window.scrollTo(0,0)}
  const na=A.includes(a)?a:A[0];if(na!==act||newT)score={ok:0,total:0};act=na;
  renderTema();
}
window.addEventListener("hashchange",route);
route();
</script>
